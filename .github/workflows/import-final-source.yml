name: Import final sanitized source

on:
  push:
    branches: [source-import]
    paths:
      - '.source-import/lawfirm-final-source.b64'
      - '.github/workflows/import-final-source.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .source-import/lawfirm-final-source.b64 > /tmp/lawfirm-final-source.tar.xz
          echo "7dc3977b49d0054c88ae269f7b6059c17ce1d03e52e09e1bd682016442c7e929  /tmp/lawfirm-final-source.tar.xz" | sha256sum -c -
          tar -tJf /tmp/lawfirm-final-source.tar.xz > /tmp/archive-list.txt
          test "$(wc -l < /tmp/archive-list.txt)" -ge 300

      - name: Extract clean source
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/lawfirm-final-source.tar.xz -C .
          test -f composer.lock
          test -f .env.example
          test -f public/index.php
          test -f .github/workflows/ci.yml

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Import complete sanitized Laravel source"
          git push origin HEAD:source-import
