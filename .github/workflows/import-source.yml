name: Import prepared application source

on:
  push:
    branches: [main]
    paths:
      - '.import/done'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild prepared source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .import/chunk_* > /tmp/lawyer-source.b64
          base64 --decode /tmp/lawyer-source.b64 > /tmp/lawyer-source.zip
          unzip -oq /tmp/lawyer-source.zip -d .
          rm -rf .import
          rm -f .github/workflows/import-source.yml

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Laravel law firm application prepared for Hostinger" || exit 0
          git push origin HEAD:main
